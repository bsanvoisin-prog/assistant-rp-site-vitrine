# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: bsanvoisin-prog/assistant-rp-site-vitrine
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/8d558beb-eca6-4f8c-b472-cc4ecbd61ed3/pkce
  auth_token_endpoint: /sites/8d558beb-eca6-4f8c-b472-cc4ecbd61ed3/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://assistant-rp.com
media_folder: "content/blog/uploads"
public_folder: "/blog/uploads"

publish_mode: editorial_workflow
# "editorial_workflow" ajoute un statut Brouillon / En relecture / Prêt à publier,
# avec un espace de prévisualisation avant publication réelle. Supprimer cette ligne
# si tu préfères publier directement sans étape de relecture.

locale: "fr"

collections:
  - name: "blog"
    label: "Articles de blog"
    label_singular: "Article"
    folder: "content/blog"
    create: true
    extension: "md"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: true
      - label: "Extrait"
        name: "excerpt"
        widget: "text"
        hint: "2-3 phrases affichées sur la page de liste du blog."
      - label: "Image de couverture"
        name: "cover"
        widget: "image"
        required: false
      - label: "Auteur"
        name: "author"
        widget: "string"
        default: "L'équipe Assistant-RP"
      - label: "Tags"
        name: "tags"
        widget: "hidden"
        default: "post"
      - label: "Contenu"
        name: "body"
        widget: "markdown"
